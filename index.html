<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMC & ICT 6-Master AI Terminal</title>
  <style>
    body { background-color: #12161f; color: #ffffff; font-family: Arial, sans-serif; margin: 0; padding: 15px; }
    .card { background: #1e222d; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #2a2e39; }
    input[type="text"], select { width: 100%; padding: 10px; background: #131722; color: #fff; border: 1px solid #363c4e; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #089981; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #5d606b; }
    .result-box { background: #131722; padding: 15px; border-radius: 5px; white-space: pre-wrap; word-wrap: break-word; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>

  <h2 style="text-align: center;">SMC & ICT 6-Master AI Terminal</h2>

  <div class="card">
    <h3>0. Weka Gemini API Key Yako</h3>
    <input type="text" id="apiKey" placeholder="Paste Gemini API Key hapa (AQ.Ab... au AIzaSy...)">
  </div>

  <div class="card">
    <h3>1. Chagua Market / Pair</h3>
    <select id="pair">
      <option value="XAUUSD">XAU/USD (Gold)</option>
      <option value="BTCUSD">BTC/USD (Bitcoin)</option>
      <option value="EURUSD">EUR/USD</option>
      <option value="GBPUSD">GBP/USD</option>
      <option value="NASDAQ">NASDAQ (US100)</option>
    </select>
  </div>

  <div class="card">
    <h3>2. Upload Screenshot ya Chati</h3>
    <input type="file" id="chartImage" accept="image/*">
  </div>

  <button id="runBtn" onclick="analyzeChart()">RUN VISION AI ANALYSIS</button>

  <div class="card" style="margin-top: 15px;">
    <h3>3. Majibu ya Uchambuzi (Masters 6)</h3>
    <div id="status" style="color: #f0b90b; font-size: 13px; margin-bottom: 8px;"></div>
    <div id="output" class="result-box">Majibu yataonekana hapa baada ya kubonyeza RUN...</div>
  </div>

<script>
async function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = error => reject(error);
    reader.readAsDataURL(file);
  });
}

async function analyzeChart() {
  const apiKey = document.getElementById('apiKey').value.trim();
  const fileInput = document.getElementById('chartImage');
  const statusDiv = document.getElementById('status');
  const outputDiv = document.getElementById('output');
  const runBtn = document.getElementById('runBtn');

  if (!apiKey) {
    alert("Tafadhali weka Gemini API Key kwanza.");
    return;
  }

  if (fileInput.files.length === 0) {
    alert("Tafadhali chagua picha ya chati kabla ya kuendelea.");
    return;
  }

  runBtn.disabled = true;
  statusDiv.innerText = "AI inachunguza picha yako... Tafadhali subiri.";
  outputDiv.innerText = "Inachakata...";

  try {
    const base64Image = await fileToBase64(fileInput.files[0]);
    const pair = document.getElementById('pair').value;

    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

    const promptText = `Wewe ni mtaalamu wa technical analysis kwa kutumia mfumo wa 6-Master Framework (Price Action, Supply/Demand, Market Structure, Fundamental Analysis, SMC Liquidity, na ICT Concepts). 
Fanya uchambuzi wa kina juu ya chati hii ya ${pair} na utoe majibu kwa lugha ya Kiswahili kwa kuainisha:
1. Direction Trend (Bullish/Bearish)
2. Key Levels (Liquidity Sweeps, Order Blocks, FVG)
3. Entry Signal & Risk/Reward Ratio.`;

    const response = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [
            { text: promptText },
            {
              inline_data: {
                mime_type: fileInput.files[0].type || "image/png",
                data: base64Image
              }
            }
          ]
        }]
      })
    });

    const data = await response.json();

    if (data.error) {
      statusDiv.innerText = "Kosa kutoka kwenye API:";
      outputDiv.innerText = JSON.stringify(data.error, null, 2);
    } else if (data.candidates && data.candidates[0].content.parts[0].text) {
      statusDiv.innerText = "Uchambuzi Umekamilika!";
      outputDiv.innerText = data.candidates[0].content.parts[0].text;
    } else {
      statusDiv.innerText = "Kosa lisilojulikana:";
      outputDiv.innerText = JSON.stringify(data, null, 2);
    }

  } catch (err) {
    statusDiv.innerText = "Kosa la Mfumo:";
    outputDiv.innerText = err.message;
  } finally {
    runBtn.disabled = false;
  }
}
</script>

</body>
</html>
