
<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMC & ICT 6-Master AI Terminal</title>
  <style>
    body { background-color: #12161f; color: #ffffff; font-family: Arial, sans-serif; margin: 0; padding: 15px; }
    .card { background: #1e222d; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #2a2e39; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    select, input[type="file"] { width: 100%; padding: 12px; background: #131722; color: #fff; border: 1px solid #363c4e; border-radius: 6px; box-sizing: border-box; margin-top: 5px; font-size: 14px; }
    button { width: 100%; padding: 14px; background: #089981; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    button:hover { background: #07856d; }
    button:disabled { background: #5d606b; cursor: not-allowed; }
    .result-box { background: #131722; padding: 18px; border-radius: 6px; white-space: pre-wrap; word-wrap: break-word; font-size: 14px; line-height: 1.6; min-height: 120px; border: 1px solid #2a2e39; color: #e1e4ed; }
    label { font-size: 13px; color: #848e9c; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
    .tf-group { margin-bottom: 15px; }
    h2 { color: #f0b90b; letter-spacing: 0.5px; }
    h3 { color: #d1d4dc; font-size: 16px; margin-top: 0; }
  </style>
</head>
<body>

  <h2 style="text-align: center;">⚡ SMC & ICT 6-MASTER AI TERMINAL ⚡</h2>

  <div class="card">
    <h3>1. Chagua Market / Pair</h3>
    <select id="pair">
      <option value="XAUUSD">XAU/USD (Gold)</option>
      <option value="BTCUSD">BTC/USD (Bitcoin)</option>
      <option value="EURUSD">EUR/USD</option>
      <option value="GBPUSD">GBP/USD</option>
      <option value="USDJPY">USD/JPY</option>
      <option value="AUDUSD">AUD/USD</option>
      <option value="USDCAD">USD/CAD</option>
      <option value="GBPJPY">GBP/JPY</option>
      <option value="US100">NASDAQ (US100)</option>
      <option value="US30">US30 (Dow Jones)</option>
    </select>
  </div>

  <div class="card">
    <h3>2. Upload Timeframe Screenshots</h3>
    
    <div class="tf-group">
      <label>H4 Chart (Trend & HTF Order Blocks):</label>
      <input type="file" id="chartH4" accept="image/*">
    </div>

    <div class="tf-group">
      <label>H1 Chart (Liquidity Sweeps & Structure):</label>
      <input type="file" id="chartH1" accept="image/*">
    </div>

    <div class="tf-group">
      <label>M15 Chart (Entry Signal, CHoCH, FVG):</label>
      <input type="file" id="chartM15" accept="image/*">
    </div>
  </div>

  <button id="runBtn" onclick="analyzeChart()">RUN VISION AI ANALYSIS</button>

  <div class="card" style="margin-top: 15px;">
    <h3>3. Maoni ya Masters 6 Mmoja Mmoja & Hitimisho</h3>
    <div id="status" style="color: #f0b90b; font-size: 13px; margin-bottom: 8px; font-weight: bold;"></div>
    <div id="output" class="result-box">Uchambuzi wa kila master, mtazamo wa pamoja, na viwango vya fedha (USD & TZS) vitaonekana hapa...</div>
  </div>

<script>
const INTERNAL_API_KEY = 'AQ.Ab8RN6KBdwPCMJPh6-H6H051H-aOt7jRsq6zg8d2VHSrDyuK6w';

async function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = error => reject(error);
    reader.readAsDataURL(file);
  });
}

async function analyzeChart() {
  const h4Input = document.getElementById('chartH4');
  const h1Input = document.getElementById('chartH1');
  const m15Input = document.getElementById('chartM15');
  
  const statusDiv = document.getElementById('status');
  const outputDiv = document.getElementById('output');
  const runBtn = document.getElementById('runBtn');

  if (h4Input.files.length === 0 && h1Input.files.length === 0 && m15Input.files.length === 0) {
    alert("Tafadhali chagua angalau picha moja ya chati (H4, H1, au M15) kabla ya kuendelea.");
    return;
  }

  runBtn.disabled = true;
  statusDiv.innerText = "⏳ Masters 6 wanatathmini kwa kina kila mmoja kivyake... Tafadhali subiri.";
  outputDiv.innerText = "Inachakata mitazamo ya kila Master...";

  try {
    const parts = [];
    const pair = document.getElementById('pair').value;

    const promptText = `Wewe ni mfumo wa AI Trading Terminal wenye uchambuzi wa kina kupitia Masters 6 wa Trading. 
Changanua picha za chati za pair ya ${pair} zilizowekwa (H4, H1, M15) na utoe ripoti kwa lugha ya Kiswahili iliyogawanyika katika sehemu zifuatazo:

1. MAONI YA MASTERS 6 MMOJA MMOJA (Taja kila mmoja na msimamo wake: BUY, SELL, au WAIT):
   - Price Action Master: [Mtazamo na sababu fupi]
   - Supply & Demand Master: [Mtazamo na sababu fupi]
   - Market Structure Master: [Mtazamo na sababu fupi]
   - Fundamental Analysis Master: [Mtazamo na sababu fupi]
   - SMC Liquidity Master: [Mtazamo na sababu fupi]
   - ICT Concepts Master: [Mtazamo na sababu fupi]

2. HITIMISHO LA PAMOJA NA CONFIDENCE LEVEL:
   - Je, wote wamealiana (Consensus)? Kama wote wanakubaliana toa **STRONG BUY** au **STRONG SELL**. Kama wanapishana (mfano Price Action anapingana na Demand & Supply) toa **WAIT / STAND ASIDE**.
   - Confidence Level: Taja wazi kama ni **High**, **Medium**, au **Low** kutokana na kiwango cha makubaliano yao.

3. RISK MANAGEMENT & FEDHA (USD & TZS):
   - Entry Zone: [Eneo la kuingilia]
   - Stop Loss (SL): [Bei kamili na alama yake]
   - Take Profit (TP1 & TP2): [Viwango vya malengo]
   - Makadirio ya Faida (Potential Profit): Dola ($) na thamani yake katika Shilingi za Kitanzania (TZS) (mfano kwa kutumia kiwango cha 1 USD = 2,600 TZS).
   - Makadirio ya Hasara (Potential Loss / Risk): Dola ($) na TZS endapo SL itapigwa.
   - Risk to Reward Ratio (R:R).`;

    parts.push({ text: promptText });

    if (h4Input.files.length > 0) {
      const base64H4 = await fileToBase64(h4Input.files[0]);
      parts.push({ text: "Hii hapa picha ya H4 Timeframe:" });
      parts.push({ inline_data: { mime_type: h4Input.files[0].type || "image/png", data: base64H4 } });
    }

    if (h1Input.files.length > 0) {
      const base64H1 = await fileToBase64(h1Input.files[0]);
      parts.push({ text: "Hii hapa picha ya H1 Timeframe:" });
      parts.push({ inline_data: { mime_type: h1Input.files[0].type || "image/png", data: base64H1 } });
    }

    if (m15Input.files.length > 0) {
      const base64M15 = await fileToBase64(m15Input.files[0]);
      parts.push({ text: "Hii hapa picha ya M15 Timeframe:" });
      parts.push({ inline_data: { mime_type: m15Input.files[0].type || "image/png", data: base64M15 } });
    }

    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${INTERNAL_API_KEY}`;

    const response = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: parts }] })
    });

    const data = await response.json();

    if (data.error) {
      statusDiv.innerText = "Kosa kutoka kwenye API:";
      outputDiv.innerText = JSON.stringify(data.error, null, 2);
    } else if (data.candidates && data.candidates[0].content.parts[0].text) {
      statusDiv.innerText = "✅ Uchambuzi wa Masters 6 Umekamilika kwa Viwango na Mitazamo ya Kipekee!";
      outputDiv.innerText = data.candidates[0].content.parts[0].text;
    } else {
      statusDiv.innerText = "Majibu yasiyotarajiwa:";
      outputDiv.innerText = JSON.stringify(data, null, 2);
    }

  } catch (err) {
    statusDiv.innerText = "Kosa la Mfumo:";
    outputDiv.innerText = err.message;
  } finally {
    runBtn.disabled = false;
  }
}
</script>

</body>
</html>
