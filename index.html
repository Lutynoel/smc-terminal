<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMC Personal Analyzer</title>
    <style>
        body {
            background-color: #12161f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
        }
        .header {
            text-align: center;
            padding: 10px;
            background: #1e222d;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .chart-container {
            height: 400px;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .card {
            background: #1e222d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .card h3 {
            margin-top: 0;
            color: #2962ff;
            border-bottom: 1px solid #2a2e3d;
            padding-bottom: 8px;
        }
        .checklist-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .checklist-item input {
            margin-right: 10px;
            transform: scale(1.2);
        }
        .calc-group, .journal-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #b2b5be;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #2a2e3d;
            background: #131722;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background: #2962ff;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            border: none;
        }
        button:hover {
            background: #1e53e5;
        }
        .res-box {
            background: #131722;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            border-left: 4px solid #2962ff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 12px;
        }
        th, td {
            border: 1px solid #2a2e3d;
            padding: 8px;
            text-align: center;
        }
        th {
            background: #131722;
            color: #2962ff;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin:0; font-size:18px;">SMC/ICT Personal Terminal</h2>
    </div>

    <!-- TradingView Chart Embed -->
    <div class="chart-container">
        <div id="tradingview_chart" style="height:100%;width:100%;"></div>
    </div>

    <!-- Risk / Reward Calculator -->
    <div class="card">
        <h3>Risk & Lot Size Calculator</h3>
        <div class="calc-group">
            <label for="slPips">Stop Loss (Pips):</label>
            <input type="number" id="slPips" placeholder="Mfano: 15" oninput="calculateLot()">
        </div>
        <div class="res-box">
            <div>Fixed Risk: <strong>$2.00</strong></div>
            <div>Target Profit (1:3 RR): <strong style="color: #089981;">$6.00</strong></div>
            <div style="margin-top: 5px;">Recommended Lot Size: <strong id="recLot" style="color: #ff3a43;">0.00</strong></div>
        </div>
    </div>

    <!-- SMC Execution Checklist -->
    <div class="card">
        <h3>SMC Entry Checklist</h3>
        <div class="checklist-item">
            <input type="checkbox" id="rule1">
            <label for="rule1">Liquidity Swept (PDH / PDL / SSL / BSL)?</label>
        </div>
        <div class="checklist-item">
            <input type="checkbox" id="rule2">
            <label for="rule2">Fair Value Gap (FVG) / Order Block Tapped?</label>
        </div>
        <div class="checklist-item">
            <input type="checkbox" id="rule3">
            <label for="rule3">Lower Timeframe MSS / CHoCH Confirmed?</label>
        </div>
        <div class="checklist-item">
            <input type="checkbox" id="rule4">
            <label for="rule4">No High-Impact News (NFP/CPI) within 30 mins?</label>
        </div>
    </div>

    <!-- SMC Trading Journal -->
    <div class="card">
        <h3>Daily Trading Journal</h3>
        <div class="journal-group">
            <label for="pair">Pair / Session:</label>
            <input type="text" id="pair" value="GBPUSD - London/NY">
        </div>
        <div class="journal-group">
            <label for="tradeType">Type:</label>
            <select id="tradeType">
                <option value="BUY">BUY</option>
                <option value="SELL">SELL</option>
            </select>
        </div>
        <div class="journal-group">
            <label for="pnl">Matokeo ($ Profit/Loss):</label>
            <input type="number" id="pnl" placeholder="Mfano: 6.00 au -2.00">
        </div>
        <button onclick="addJournalEntry()">Hifadhi Trade</button>

        <table>
            <thead>
                <tr>
                    <th>Tarehe</th>
                    <th>Type</th>
                    <th>P&L ($)</th>
                </tr>
            </thead>
            <tbody id="journalBody">
                <!-- Data zitajaa hapa -->
            </tbody>
        </table>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        // TradingView Chart Setup
        new TradingView.widget({
            "autosize": true,
            "symbol": "FX:GBPUSD",
            "interval": "60",
            "timezone": "Africa/Nairobi",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "container_id": "tradingview_chart"
        });

        // Lot Size Calculation ($2 Fixed Risk)
        function calculateLot() {
            let pips = parseFloat(document.getElementById('slPips').value);
            if (pips > 0) {
                // Kwa GBPUSD, 1 pip kwa 0.01 lot ni $0.10
                let lot = 2.00 / (pips * 10);
                document.getElementById('recLot').innerText = lot.toFixed(2);
            } else {
                document.getElementById('recLot').innerText = "0.00";
            }
        }

        // Journal Persistence using LocalStorage
        function addJournalEntry() {
            let type = document.getElementById('tradeType').value;
            let pnl = parseFloat(document.getElementById('pnl').value);
            
            if (isNaN(pnl)) {
                alert("Tafadhali weka kiasi cha Profit au Loss!");
                return;
            }

            let date = new Date().toLocaleDateString();
            let entries = JSON.parse(localStorage.getItem('smc_journal') || "[]");
            
            entries.push({ date: date, type: type, pnl: pnl });
            localStorage.setItem('smc_journal', JSON.stringify(entries));
            
            document.getElementById('pnl').value = '';
            renderJournal();
        }

        function renderJournal() {
            let entries = JSON.parse(localStorage.getItem('smc_journal') || "[]");
            let tbody = document.getElementById('journalBody');
            tbody.innerHTML = '';
            
            entries.forEach(item => {
                let color = item.pnl >= 0 ? '#089981' : '#ff3a43';
                let row = `<tr>
                    <td>${item.date}</td>
                    <td>${item.type}</td>
                    <td style="color:${color}; font-weight:bold;">${item.pnl >= 0 ? '+' : ''}${item.pnl.toFixed(2)}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        // Load Journal on start
        renderJournal();
    </script>
</body>
</html>
